name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Store password'
        required: true
      key_password:
        description: 'Key password'
        required: true
      key_alias:
        description: 'Key alias'
        required: true
        default: 'upload'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "${{ inputs.key_alias }}" \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=Android Release,O=Linkdon,C=US"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: my-upload-key.jks
