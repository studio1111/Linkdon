name: Build & Release Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AGP Version
        run: |
          AGP_VERSION=$(grep 'agp =' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Detected AGP version: $AGP_VERSION"
          if [ "$AGP_VERSION" != "9.1.1" ]; then
            echo "Error: AGP version is not 9.1.1 (found $AGP_VERSION)"
            exit 1
          fi

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Temporary Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linkdoon-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          
          echo "Found APK: $APK_FILE"
          gh release create "$TAG_NAME" "$APK_FILE" \
            --title "Linkdoon Debug APK Build #${{ github.run_number }}" \
            --notes "Automatic Debug APK build generated for commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
