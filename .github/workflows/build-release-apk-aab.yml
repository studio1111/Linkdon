name: Build Release APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode Release Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      - name: Build Release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linkdon-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linkdon-Release-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="release-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          RELEASE_AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          if [ -z "$RELEASE_APK" ] || [ -z "$RELEASE_AAB" ]; then
            echo "Error: Release build outputs not found!"
            exit 1
          fi

          gh release create "$TAG_NAME" "$RELEASE_APK" "$RELEASE_AAB" \
            --title "Linkdon Release Build #${{ github.run_number }}" \
            --notes "Release build generated for commit ${{ github.sha }}." \
            --target "${{ github.sha }}"
